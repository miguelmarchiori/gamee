<script>
'use strict';
// Spike: uma sala em pixel art. Mira e golpe no mouse, parkour no teclado, um golpe mata.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value

const CONTROLS = [
  'A D / SETAS: mover      W / ESPAÇO: pular (na parede: pulo na parede)',
  'S no chão: rolar (invencível)      S no ar: cair rápido',

let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random

  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';

function text(s, x, y, size, c, align = 'center') {

  ctx.textBaseline = 'middle'; ctx.fillText(s, Math.round(x), Math.round(y));
}
function shadowText(s, x, y, size, c, align = 'center') { text(s, x + 1, y + 1, size, '#000', align); text(s, x, y, size, c, align); }

// ---- Input: keyboard by position, mouse as Mouse0 / Mouse2 -------------------------------
const down = new Set(), hit = new Set();

const anyHit = (...c) => c.some(k => hit.has(k));
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
const mouse = { x: W * 0.7, y: H * 0.6, seen: false }; // screen position, logical pixels
function readMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; mouse.seen = true;
}
canvas.addEventListener('pointermove', readMouse);
canvas.addEventListener('pointerdown', e => {

  const code = e.button === 2 ? 'Mouse2' : 'Mouse0'; down.add(code); hit.add(code); e.preventDefault();

addEventListener('pointerup', e => down.delete(e.button === 2 ? 'Mouse2' : 'Mouse0'));
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- Audio ---------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {

    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };

function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();

  g.gain.setValueAtTime(0.0001, audio.ac.currentTime); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  if (!audio || muted) return;
  const ac = audio.ac, n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (hashf(i + n) * 2 - 1) * (1 - i / n);

const sfx = {
  jump: () => tone(420, 0.08, 'square', 0.1, 1.6),
  walljump: () => tone(520, 0.09, 'square', 0.12, 1.5),
  land: () => noise(0.05, 0.12, 300),
  roll: () => noise(0.25, 0.12, 1500),
  dash: () => { noise(0.12, 0.25, 2000); tone(300, 0.12, 'sawtooth', 0.08, 2.5); },
  swing: () => { noise(0.09, 0.28, 3000); tone(900, 0.07, 'sawtooth', 0.06, 0.4); },
  kill: () => { noise(0.2, 0.4, 150); tone(90, 0.25, 'sawtooth', 0.25, 0.4); },
  deflect: () => { tone(1800, 0.12, 'square', 0.15, 0.6); noise(0.08, 0.3, 4000); },
  throw: () => tone(700, 0.1, 'triangle', 0.15, 0.5),
  pickup: () => tone(880, 0.06, 'square', 0.12, 1.2),
  shoot: () => { noise(0.1, 0.35, 600); tone(160, 0.1, 'square', 0.2, 0.5); },
  aim: () => tone(1400, 0.05, 'sine', 0.06),
  glass: () => noise(0.15, 0.25, 3000),
  die: () => { tone(300, 0.4, 'sawtooth', 0.3, 0.2); noise(0.3, 0.3, 200); },
  clear: () => { tone(523, 0.12, 'square', 0.15); tone(659, 0.12, 'square', 0.15, 0, 0.12); tone(784, 0.3, 'square', 0.15, 0, 0.24); },
};

// ---- The room ------------------------------------------------------------------------
const TS = 16, COLS = 60, ROWS = 17, LW = COLS * TS, LH = ROWS * TS;
const grid = [];
(function buildLevel() {
  for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0));
  const rect = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) grid[j][i] = 1; };
  rect(0, 0, COLS, 1); rect(0, ROWS - 1, COLS, 1); rect(0, 0, 1, ROWS); rect(COLS - 1, 0, 1, ROWS);
  rect(8, 13, 1, 3);      // caixote: primeiro pulo
  rect(10, 10, 6, 1);     // plataforma do 1º atirador
  rect(19, 12, 9, 1);     // passarela
  rect(30, 13, 3, 3);     // pilha de caixas
  rect(30, 5, 10, 1);     // andaime alto
  rect(39, 6, 1, 5);      // pilar pendurado: parede para pular
  rect(41, 10, 2, 1);     // apoio no vão
  rect(44, 6, 1, 8);      // poço: parede esquerda (aberta embaixo)
  rect(48, 4, 1, 10);     // poço: parede direita
  rect(48, 4, 10, 1);     // telhado do último atirador
})();
const SPAWNS = [
  ['thug', 16, 16], ['gunner', 13, 10], ['thug', 23, 12], ['gunner', 35, 5],
  ['gunner', 42, 16], ['thug', 53, 16], ['gunner', 55, 4],
];
const ITEMS = [['bottle', 5, 16], ['knife', 26, 16], ['bottle', 35, 16]];
const LAMPS = [ // luminárias: x, y (onde pendem), cor
  [5 * TS, TS, '#ff2e88'], [13 * TS, 11 * TS, '#2ee6ff'], [24 * TS, 13 * TS, '#ffb03f'],
  [35 * TS, 6 * TS, '#ff2e88'], [46 * TS, TS, '#2ee6ff'], [53 * TS, 5 * TS, '#ffb03f'],
];
const solidTile = (i, j) => (i < 0 || j < 0 || i >= COLS || j >= ROWS) ? true : grid[j][i] === 1;
const solidAt = (x, y) => solidTile(Math.floor(x / TS), Math.floor(y / TS));
function rectHits(x, y, w, h) {
  const i0 = Math.floor(x / TS), i1 = Math.floor((x + w - 0.001) / TS);
  const j0 = Math.floor(y / TS), j1 = Math.floor((y + h - 0.001) / TS);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (solidTile(i, j)) return true;
  return false;
}
function moveX(a, dx) {
  a.x += dx;
  if (!rectHits(a.x, a.y, a.w, a.h)) return false;
  if (dx > 0) a.x = Math.floor((a.x + a.w) / TS) * TS - a.w - 0.01;
  else a.x = (Math.floor(a.x / TS) + 1) * TS + 0.01;
  return true;
}
function moveY(a, dy) {
  a.y += dy;
  if (!rectHits(a.x, a.y, a.w, a.h)) return false;
  if (dy > 0) a.y = Math.floor((a.y + a.h) / TS) * TS - a.h - 0.01;
  else a.y = (Math.floor(a.y / TS) + 1) * TS + 0.01;
  return true;
}
const onGround = a => rectHits(a.x, a.y + a.h, a.w, 1.5);
function los(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 4);
  for (let i = 1; i < n; i++) if (solidAt(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false;
  return true;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function circleRect(cx, cy, r, b) {
  const nx = Math.max(b.x, Math.min(cx, b.x + b.w)), ny = Math.max(b.y, Math.min(cy, b.y + b.h));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;

const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sign = v => v < 0 ? -1 : 1;

// ---- Palette (noite de neon) ---------------------------------------------------------
const PAL = {
  sky0: '#090414', sky1: '#24103a', far: '#1a1030', near: '#22153f', wall: '#110a1d', wallHi: '#21163a',
  neonA: '#ff2e88', neonB: '#2ee6ff', neonC: '#ffd23f', outline: '#05030a',
  tile: '#0a0612', tileHi: '#3b2a63', tileEdge: '#2ee6ff', tileDot: '#1a1230',
  rain: 'rgba(140,180,255,0.32)',
  player: { coat: '#26263e', coatD: '#14141f', coatHi: '#5a5a92', pants: '#1c1c2a', pantsD: '#111119', skin: '#f0c098', skinD: '#c48c6c',
    hair: '#0c0c14', accent: '#ff2e55', boots: '#2e1f1a', bootsHi: '#6a4a38', glove: '#3e2a36', belt: '#4a4a5c' },
  thug: { coat: '#8a5228', coatD: '#5a3418', coatHi: '#c8844a', pants: '#2a2a34', pantsD: '#1c1c24', skin: '#d49870', skinD: '#a06c4c',
    hair: '#24402a', accent: '#e8e0c0', boots: '#1a1a1a', bootsHi: '#444', glove: '#d49870', belt: '#2a1a0a' },
  gunner: { coat: '#2b3f63', coatD: '#1a2740', coatHi: '#6a8cc8', pants: '#1a2740', pantsD: '#111a2c', skin: '#e0aa84', skinD: '#b07a5a',
    hair: '#0e1218', accent: '#ff2e55', boots: '#0a0a0a', bootsHi: '#333', glove: '#e0aa84', belt: '#0e1622' },
  blood: '#ff2244', bloodD: '#a0102a',
};
const CITY = [[], []];
for (let L = 0; L < 2; L++) {
  let x = -20;
  for (let i = 0; x < W + LW * 0.5; i++) {
    const w = 24 + Math.floor(hashf(i * 7 + L * 101) * 40), h = (L ? 80 : 120) + Math.floor(hashf(i * 13 + L * 57) * (L ? 90 : 100));
    CITY[L].push({ x, w, h, seed: i * 31 + L * 999 }); x += w + 2 + Math.floor(hashf(i * 3 + L) * 8);
  }
}

// ---- Scenes ---------------------------------------------------------------------------
let scene, state, best = null;
function makeActor(type, col, row) {
  const w = 10, h = 20;
  return { type, x: col * TS + 3, y: row * TS - h - 0.01, w, h, vx: 0, vy: 0, f: -1, alive: true,
    ai: 'idle', t: 0, cd: 0, dir: -1, tx: 0, ty: 0, phase: 0, deadT: 0, landed: 0 };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { deaths: 0, gained: '' };
  restartRoom();
}
function restartRoom() {
  const p = { type: 'player', x: 3 * TS + 3, y: 16 * TS - 20.01, w: 10, h: 20, vx: 0, vy: 0, f: 1, alive: true,
    coyote: 0, buffer: 0, wallLock: 0, dashT: 0, attackT: 0, attackCd: 0, rollT: 0, rolling: false, aim: 0, aimY: 0,
    airAttacks: tune.air_attacks, airDashes: tune.air_dashes, dashCd: 0, invT: 0, dashKind: '', held: null, grounded: true, phase: 0, landed: 0, scarf: [], ghostTick: 0 };
  for (let i = 0; i < 7; i++) p.scarf.push({ x: p.x, y: p.y + 6 });
  Object.assign(state, {
    t: 0, p, enemies: SPAWNS.map(s => makeActor(...s)),
    items: ITEMS.map(([type, c, r]) => ({ type, x: c * TS + 4, y: r * TS - 6, w: 8, h: 6, vx: 0, vy: 0, mode: 'ground', ammo: 0, spin: 0 })),
    bullets: [], parts: [], decals: [], ghosts: [], slashes: [], shake: 0, hitstop: 0, flash: 0, deadT: 0, clearT: 0,
    cleared: false, kills: 0, cam: { x: 0, y: LH - H }, score: 0, glitch: 0.25,
  });
  state.total = state.enemies.length;
}
function killEnemy(e, dirX, dirY = -0.4) {
  if (!e.alive) return;
  e.alive = false; e.deadT = 0; e.vx = dirX * 160; e.vy = -140 + dirY * 60; e.f = -sign(dirX);
  state.kills++; state.score = state.kills;
  state.hitstop = tune.hitstop; state.shake = tune.shake; state.flash = 0.12;
  gore(e.x + e.w / 2, e.y + 8, dirX, 28);
  if (e.type === 'gunner') state.items.push({ type: 'pistol', x: e.x + 1, y: e.y + 8, w: 8, h: 5, vx: dirX * 60, vy: -160, mode: 'ground', ammo: tune.pistol_ammo, spin: 0 });
  sfx.kill(); events.push({ type: 'kill', enemy: e.type });
}
function killPlayer(dirX) {
  const p = state.p; if (!p.alive || state.cleared || p.rolling || p.invT > 0) return; // rolando ou no dash = invencível
  if (p.rolling) endRoll(p);
  p.alive = false; state.deadT = tune.restart_delay; state.deaths++; state.shake = tune.shake * 1.5; state.glitch = tune.restart_delay;
  gore(p.x + p.w / 2, p.y + 8, dirX, 34); p.vx = dirX * 160; p.vy = -150;
  p.held = null;
  sfx.die(); events.push({ type: 'death' });
}
function gore(x, y, dirX, n) {
  for (let i = 0; i < n; i++) {
    state.parts.push({ x, y, vx: dirX * (40 + rng() * 220) + (rng() - 0.5) * 120, vy: -60 - rng() * 220,
      life: 0.6 + rng() * 0.8, c: rng() < 0.6 ? PAL.blood : PAL.bloodD, s: rng() < 0.35 ? 2 : 1, stick: true });
  }
}
function sparks(x, y, c, n) {
  for (let i = 0; i < n; i++) state.parts.push({ x, y, vx: (rng() - 0.5) * 220, vy: -rng() * 160, life: 0.2 + rng() * 0.3, c, s: 1, stick: false });
}
function aimAngle(p) { // toward the mouse in the world; facing when the mouse was never used
  if (!mouse.seen) return p.f > 0 ? 0 : Math.PI;
  return Math.atan2(mouse.y + state.cam.y - (p.y + p.h / 2), mouse.x + state.cam.x - (p.x + p.w / 2));
}

// ---- Player ---------------------------------------------------------------------------
function updatePlayer(dt) {
  const p = state.p;
  if (!p.alive) { p.vy += 900 * dt; moveX(p, p.vx * dt); if (moveY(p, p.vy * dt)) { p.vy = 0; p.vx *= 0.6; } return; }
  const left = anyDown('ArrowLeft', 'KeyA'), right = anyDown('ArrowRight', 'KeyD');
  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  const jumpHit = anyHit('Space', 'KeyW', 'ArrowUp', 'KeyZ'), jumpHeld = anyDown('Space', 'KeyW', 'ArrowUp', 'KeyZ');
  const downHit = anyHit('ArrowDown', 'KeyS');
  const g = 2 * tune.jump_height / (tune.jump_apex_time ** 2), v0 = 2 * tune.jump_height / tune.jump_apex_time;

  const wasGround = p.grounded;
  p.grounded = onGround(p);
  if (p.grounded) { p.coyote = tune.coyote_time; p.airAttacks = tune.air_attacks; p.airDashes = tune.air_dashes; } else p.coyote -= dt;
  if (p.grounded && !wasGround && p.vyBefore > 200) { sfx.land(); p.landed = 0.1; sparks(p.x + p.w / 2, p.y + p.h, '#6a5a8a', 5); }
  p.buffer = jumpHit ? tune.jump_buffer : p.buffer - dt;
  p.wallLock -= dt; p.attackCd -= dt; p.landed -= dt; p.dashCd -= dt; p.invT -= dt;
  const wasDash = p.dashT > 0; p.dashT -= dt;
  if (wasDash && p.dashT <= 0 && p.dashKind === 'dash') { // fim do dash: perde parte da velocidade
    p.vx *= tune.dash_end_keep; if (p.vy < 0) p.vy *= tune.dash_end_keep; p.dashKind = '';

  const wallL = rectHits(p.x - 2, p.y + 3, 2, p.h - 6), wallR = rectHits(p.x + p.w, p.y + 3, 2, p.h - 6);
  p.aim = aimAngle(p);

  // Rolamento (chão) e queda rápida (ar)
  if (downHit && p.grounded && !p.rolling) {
    const d = dir !== 0 ? dir : p.f;
    p.rolling = true; p.rollT = tune.roll_time; p.h = 10; p.y += 10;
    p.vx = d * Math.max(Math.abs(p.vx), tune.roll_speed); p.f = d; sfx.roll();

    const canStand = !rectHits(p.x, p.y - 10, p.w, 20);
    if ((p.rollT <= 0 || !p.grounded) && canStand) endRoll(p);
  }

  if (!p.rolling && p.wallLock <= 0 && p.dashT <= 0) {
    const target = dir * tune.run_speed;
    let a;
    if (dir !== 0 && Math.abs(p.vx) > tune.run_speed && sign(p.vx) === dir) a = p.grounded ? tune.ground_friction * 0.5 : 120;
    else if (dir !== 0) a = p.grounded ? tune.ground_accel : tune.air_accel;
    else a = p.grounded ? tune.ground_friction : tune.air_drag; // no ar, solto: o embalo dura
    p.vx = approach(p.vx, target, a * dt);
    if (dir !== 0 && p.attackT <= 0) p.f = dir;
  }

  // Pulo, pulo na parede
  if (p.buffer > 0 && (p.grounded || p.coyote > 0) && (!p.rolling || !rectHits(p.x, p.y - 10, p.w, 20))) {
    if (p.rolling) endRoll(p);
    p.vy = -v0; p.buffer = 0; p.coyote = 0; p.grounded = false; sfx.jump();
    sparks(p.x + p.w / 2, p.y + p.h, '#6a5a8a', 3);
  } else if (p.buffer > 0 && !p.grounded && (wallL || wallR) && !p.rolling) {
    const away = wallL ? 1 : -1;
    p.vy = -v0 * tune.wall_jump_up; p.vx = away * tune.wall_jump_push; p.f = away;
    p.wallLock = tune.wall_jump_lock; p.buffer = 0; p.airAttacks = tune.air_attacks; p.airDashes = tune.air_dashes; p.noCut = true; sfx.walljump();
    sparks(wallL ? p.x : p.x + p.w, p.y + p.h / 2, PAL.neonB, 6);
  }

    ctx.fillStyle = '#7dffb0'; ctx.fillRect(x + (spin ? 1 : 3), y + (spin ? 3 : 1), 1, 1);
  } else if (it.type === 'knife') {
    ctx.fillRect(x - 1, y + 1, 11, 4);
    ctx.fillStyle = '#dfe6f2'; ctx.fillRect(x, y + 3, 6, 1); ctx.fillRect(x + 1, y + 2, 4, 1);
    ctx.fillStyle = '#5a3a20'; ctx.fillRect(x + 6, y + 2, 3, 2);
  } else {
    ctx.fillRect(x - 1, y, 9, 4); ctx.fillRect(x + 3, y + 2, 4, 5);
    ctx.fillStyle = '#9aa0b4'; ctx.fillRect(x, y + 1, 7, 2); ctx.fillStyle = '#555a6a'; ctx.fillRect(x + 4, y + 3, 2, 3);
  }
  if (it.mode === 'ground') {
    const blink = (Math.floor(state.t * 4) % 2) ? PAL.neonC : 'rgba(255,210,63,0.4)';
    ctx.fillStyle = blink; ctx.fillRect(x + 3, y - 5, 2, 2);
  }
}

// ---- World drawing ----------------------------------------------------------------------
const VIGNETTE = (() => { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)'); return g; })();
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, PAL.sky0); g.addColorStop(0.7, PAL.sky1); g.addColorStop(1, '#3a1440');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // lua de neon
  const mx = Math.round(360 - camX * 0.05);
  ctx.fillStyle = 'rgba(255,46,136,0.15)'; ctx.beginPath(); ctx.arc(mx, 70, 34, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff5fa2'; ctx.beginPath(); ctx.arc(mx, 70, 22, 0, 7); ctx.fill();
  ctx.fillStyle = PAL.sky0; for (let i = 0; i < 5; i++) ctx.fillRect(mx - 24, 72 + i * 5, 48, 1 + i * 0.6);
  [[0.15, PAL.far, 0], [0.4, PAL.near, 1]].forEach(([k, col, L]) => {
    for (const b of CITY[L]) {
      const x = Math.round(b.x - camX * k), y = H - b.h;
      if (x > W || x + b.w < 0) continue;
      ctx.fillStyle = col; ctx.fillRect(x, y, b.w, b.h);
      ctx.fillStyle = L ? '#2c1d50' : '#20163a'; ctx.fillRect(x, y, 1, b.h);
      for (let wy = y + 6; wy < H - 6; wy += 7) for (let wx = x + 3; wx < x + b.w - 3; wx += 5) {
        const h = hashf(b.seed + wx * 3 + wy * 7);
        if (h > (L ? 0.82 : 0.88)) { ctx.fillStyle = h > 0.95 ? PAL.neonB : h > 0.9 ? PAL.neonA : '#3d2c5a'; ctx.fillRect(wx, wy, 2, 2); }
      }
      if (L === 1 && hashf(b.seed) > 0.7) {
        const on = Math.floor(state.t * 2 + b.seed) % 7 !== 0;
        ctx.globalAlpha = 0.55; ctx.fillStyle = on ? (hashf(b.seed + 1) > 0.5 ? PAL.neonA : PAL.neonC) : '#2a1d40';
        ctx.fillRect(x + Math.floor(b.w / 2) - 2, y + 8, 4, 18); ctx.globalAlpha = 1;
      }
    }
  });
  // parede interna do prédio com janelões (paralaxe 0.85)
  const k = 0.85, span = 128, off = -((camX * k) % span);
  ctx.fillStyle = PAL.wall; ctx.fillRect(0, 0, W, 22); ctx.fillRect(0, 214, W, H - 214);
  ctx.fillStyle = PAL.wallHi; ctx.fillRect(0, 22, W, 2); ctx.fillRect(0, 212, W, 2);
  for (let x = off - span; x < W + span; x += span) {
    const px = Math.round(x);
    ctx.fillStyle = PAL.wall; ctx.fillRect(px, 0, 28, H);
    ctx.fillStyle = PAL.wallHi; ctx.fillRect(px + 27, 22, 1, 190); ctx.fillRect(px + 28 + 49, 24, 1, 188);
    ctx.fillStyle = '#0d0716'; ctx.fillRect(px + 2, 30, 24, 3); ctx.fillRect(px + 2, 180, 24, 3);
    ctx.fillStyle = 'rgba(46,230,255,0.06)'; ctx.fillRect(px + 30, 26, 96, 186); // reflexo no vidro
  }
  ctx.fillStyle = '#1b1030'; ctx.fillRect(0, 8, W, 3); // cano no teto
  for (let x = Math.round(-((camX * k) % 40)); x < W; x += 40) { ctx.fillStyle = '#2a1d44'; ctx.fillRect(x, 7, 3, 5); }
}
function drawTiles() {
  const i0 = Math.max(0, Math.floor(camX / TS)), i1 = Math.min(COLS - 1, Math.floor((camX + W) / TS));
  for (let j = 0; j < ROWS; j++) for (let i = i0; i <= i1; i++) {
    if (!grid[j][i]) continue;
    const x = i * TS - Math.round(camX), y = j * TS - Math.round(camY);
    ctx.fillStyle = PAL.tile; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = PAL.tileDot;
    for (let k = 0; k < 3; k++) { const h = hashf(i * 17 + j * 31 + k); ctx.fillRect(x + Math.floor(h * 14), y + Math.floor(hashf(h * 99) * 14) + 1, 2, 1); }
    if (!solidTile(i, j - 1)) { ctx.fillStyle = PAL.tileHi; ctx.fillRect(x, y, TS, 3); ctx.fillStyle = PAL.tileEdge; ctx.fillRect(x, y, TS, 1);
      ctx.fillStyle = 'rgba(46,230,255,0.12)'; ctx.fillRect(x, y - 2, TS, 2); }
    if (!solidTile(i - 1, j)) { ctx.fillStyle = PAL.tileHi; ctx.fillRect(x, y, 1, TS); }
    if (!solidTile(i + 1, j)) { ctx.fillStyle = '#1a1030'; ctx.fillRect(x + TS - 1, y, 1, TS); }
  }
}
function drawLights() {
  ctx.globalCompositeOperation = 'lighter';
  for (const [lx, ly, c] of LAMPS) {
    const x = lx - camX, y = ly - camY;
    if (x < -120 || x > W + 120) continue;
    const flick = 0.85 + 0.15 * hashf(Math.floor(state.t * 12) + lx);
    const g = ctx.createRadialGradient(x, y + 30, 2, x, y + 40, 90);
    g.addColorStop(0, c + '40'); g.addColorStop(1, c + '00');
    ctx.globalAlpha = flick; ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 4, y + 4); ctx.lineTo(x + 60, y + 130); ctx.lineTo(x - 60, y + 130); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const [lx, ly, c] of LAMPS) { // a luminária em si
    const x = Math.round(lx - camX), y = Math.round(ly - camY);
    if (x < -20 || x > W + 20) continue;
    ctx.fillStyle = '#1b1030'; ctx.fillRect(x, y - 4, 1, 4); ctx.fillStyle = PAL.outline; ctx.fillRect(x - 5, y, 11, 4);
    ctx.fillStyle = '#3a2858'; ctx.fillRect(x - 4, y, 9, 3); ctx.fillStyle = c; ctx.fillRect(x - 3, y + 3, 7, 1);
  }
}
function drawRain() {
  ctx.fillStyle = PAL.rain;
  for (let i = 0; i < 90; i++) {
    const sp = 260 + hashf(i) * 120, x = ((hashf(i * 3.1) * (W + 60) - state.t * 60 - camX * 0.6) % (W + 60) + W + 60) % (W + 60) - 30;
    const y = ((hashf(i * 7.7) * H + state.t * sp) % (H + 20)) - 10;
    ctx.fillRect(Math.round(x), Math.round(y), 1, 5);
  }
}
function drawSlashes() {
  const p = state.p, cx = p.x + p.w / 2 - camX, cy = p.y + p.h / 2 - camY, r = tune.attack_reach;
  for (const s of state.slashes) {
    const k = s.t / s.max, sweep = 1.25, start = s.ang - sweep, end = s.ang - sweep + (1 - k * 0.6) * sweep * 2;
    ctx.lineCap = 'butt';
    ctx.strokeStyle = `rgba(46,230,255,${0.5 * k})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, r, start, end); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r + 1, start + 0.15, end); ctx.stroke();
    ctx.strokeStyle = `rgba(255,46,136,${0.6 * k})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r - 4, start + 0.3, end - 0.1); ctx.stroke();
  }
}
function poseOf(a) {
  if (!a.alive) return 'dead';
  if (a.type === 'player') {
    if (a.rolling) return 'roll'; if (a.attackT > 0.04) return 'attack'; if (a.wallSliding) return 'wall';
    if (!a.grounded) return 'air'; return Math.abs(a.vx) > 20 ? 'run' : 'idle';
  }
  if (a.type === 'gunner') return a.ai === 'aim' ? 'aim' : 'idle';
  if (a.ai === 'windup') return 'windup'; if (a.ai === 'slash') return 'slash';
  return Math.abs(a.vx) > 5 ? 'run' : 'idle';
}
function drawWorld() {
  const sh = state.shake > 0.2 ? state.shake : 0;
  camX = Math.round(state.cam.x + (sh ? (hashf(state.t * 97) - 0.5) * sh * 2 : 0));
  camY = Math.round(state.cam.y + (sh ? (hashf(state.t * 53) - 0.5) * sh * 2 : 0));
  drawBackground(); drawTiles();
  for (const d of state.decals) { ctx.fillStyle = d.c; ctx.fillRect(d.x - camX, d.y - camY, d.s + 1, d.s); }
  for (const e of state.enemies) if (e.alive && e.type === 'gunner' && e.ai === 'aim') {
    const gx = e.x + e.w / 2 + e.f * 14, gy = e.y + 5, locked = e.t <= tune.gunner_lock_time;
    ctx.strokeStyle = locked ? '#ff2244' : 'rgba(255,40,80,' + (0.3 + 0.25 * (Math.floor(state.t * 20) % 2)) + ')';
    ctx.lineWidth = locked ? 2 : 1; ctx.beginPath(); ctx.moveTo(gx - camX + 0.5, gy - camY + 0.5); ctx.lineTo(e.tx - camX + 0.5, e.ty - camY + 0.5); ctx.stroke();
  }
  for (const e of state.enemies) if (!e.alive) drawFigure(e, PAL[e.type], 'dead');
  for (const it of state.items) if (it.mode !== 'held') drawItem(it);
  for (const e of state.enemies) if (e.alive) {
    drawFigure(e, PAL[e.type], poseOf(e));
    const hx = Math.round(e.x + e.w / 2 - camX), hy = Math.round(e.y - camY);
    if (e.type === 'thug' && e.ai === 'windup') { ctx.fillStyle = PAL.outline; ctx.fillRect(hx - 2, hy - 13, 4, 10); ctx.fillStyle = PAL.neonC; ctx.fillRect(hx - 1, hy - 12, 2, 5); ctx.fillRect(hx - 1, hy - 6, 2, 2); }
    if (e.type === 'thug' && e.ai === 'chase') { ctx.fillStyle = PAL.neonA; ctx.fillRect(hx - 1, hy - 9, 2, 2); }
  }
  for (const g of state.ghosts) drawFigure(g, PAL.player, poseOf(g), g.c, 0.45 * g.life / g.max);
  const p = state.p;
  if (p.alive) for (let i = 0; i < p.scarf.length; i++) { const s = p.scarf[i]; ctx.fillStyle = i % 2 ? PAL.player.accent : '#c41e3e'; ctx.fillRect(Math.round(s.x - camX) - 1, Math.round(s.y - camY), 2, 2); }
  drawFigure(p, PAL.player, poseOf(p));
  if (p.held && p.alive) drawItem(p.held);
  drawSlashes();
  for (const b of state.bullets) {
    const tx = Math.round(b.x - camX), ty = Math.round(b.y - camY), k = 0.02, col = b.enemy ? PAL.neonC : b.deflected ? PAL.neonB : '#ffffff';
    ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - b.vx * k, ty - b.vy * k); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = col; ctx.fillRect(tx - 1, ty - 1, 3, 3);
  }
  for (const q of state.parts) { ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x - camX), Math.round(q.y - camY), q.s, q.s); }
  drawLights();
  drawRain();
  postFX();
}
function postFX() {
  if (state.flash > 0) { // aberração cromática e clarão no abate
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 2, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(255,255,255,${state.flash})`; ctx.fillRect(0, 0, W, H);
  }
  if (state.glitch > 0) { // tela falhando (morte / recomeço)
    for (let i = 0; i < 10; i++) {
      const y = Math.floor(hashf(state.t * 31 + i) * H), h = 2 + Math.floor(hashf(i + state.t * 7) * 10), dx = Math.round((hashf(i * 5 + state.t * 13) - 0.5) * 30);
      ctx.drawImage(canvas, 0, y, canvas.width, h, dx, y, W, h);
    }
    ctx.fillStyle = 'rgba(255,46,136,0.08)'; ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.14)'; for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
  const band = (state.t * 40) % (H + 40) - 20; ctx.fillStyle = 'rgba(255,255,255,0.025)'; ctx.fillRect(0, Math.round(band), W, 6);
}
function drawCursor() {
  if (!mouse.seen) return;
  const x = Math.round(mouse.x), y = Math.round(mouse.y), c = PAL.neonA;
  ctx.fillStyle = PAL.outline; ctx.fillRect(x - 6, y - 1, 13, 3); ctx.fillRect(x - 1, y - 6, 3, 13);
  ctx.fillStyle = c; ctx.fillRect(x - 5, y, 3, 1); ctx.fillRect(x + 3, y, 3, 1); ctx.fillRect(x, y - 5, 1, 3); ctx.fillRect(x, y + 3, 1, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 1, 1);
}
function drawHUD() {
  const p = state.p;
  ctx.fillStyle = 'rgba(5,3,10,0.6)'; ctx.fillRect(0, 0, W, 16); ctx.fillStyle = PAL.neonA; ctx.fillRect(0, 16, W, 1);
  shadowText(`ALVOS ${state.total - state.kills}/${state.total}`, 8, 8, 8, PAL.neonB, 'left');
  shadowText(`MORTES ${state.deaths}`, 92, 8, 8, PAL.neonA, 'left');
  shadowText(`${state.t.toFixed(2)}s`, W - 8, 8, 8, '#fff', 'right');
  if (best !== null) shadowText(`RECORDE ${best.toFixed(2)}s`, W - 70, 8, 8, PAL.neonC, 'right');
  if (p.held) shadowText(p.held.type === 'pistol' ? `PISTOLA x${p.held.ammo}` : p.held.type === 'knife' ? 'FACA' : 'GARRAFA', W / 2, 8, 8, PAL.neonC);
  for (let i = 0, n = tune.air_dashes; i < n; i++) { // cargas de dash no ar
    const x = Math.round(W / 2 - n * 5 + i * 10);
    ctx.fillStyle = PAL.outline; ctx.fillRect(x, H - 10, 7, 5);
    ctx.fillStyle = i < p.airDashes ? PAL.neonB : '#2a1d44'; ctx.fillRect(x + 1, H - 9, 5, 3);
  }
  if (!p.alive) shadowText('MORTO', W / 2, H / 2, 16, PAL.neonA);
  if (state.t < 4 && state.deaths === 0) shadowText('Limpe a sala. Mire com o mouse. Um golpe mata.', W / 2, H - 20, 8, '#d8d0f0');
}

// ---- Scene table ----------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      camX = 0; camY = 0; clear(PAL.sky1);
      ctx.fillStyle = PAL.tile; ctx.fillRect(0, 180, W, 90); ctx.fillStyle = PAL.tileEdge; ctx.fillRect(0, 180, W, 1);
      const list = [['Mercenário', 'player', 'idle'], ['Correndo', 'player', 'run'], ['Rolamento', 'player', 'roll'], ['Golpe', 'player', 'attack'],
        ['Capanga', 'thug', 'idle'], ['Capanga ataca', 'thug', 'slash'], ['Atirador', 'gunner', 'idle'], ['Atirador mira', 'gunner', 'aim']];
      list.forEach(([name, type, pose], i) => {
        const a = { type, x: 24 + i * 56, y: 160, w: 10, h: 20, f: 1, phase: 1, landed: 0, vx: pose === 'run' ? 160 : 0, aimY: 0 };
        if (pose === 'roll') { a.y = 170; a.h = 10; a.rollT = 0.1; }
        drawFigure(a, PAL[type], pose); text(name, a.x + 5, 196 + (i % 2) * 10, 7, '#fff');
      });
      [['Garrafa', 'bottle'], ['Faca', 'knife'], ['Pistola', 'pistol']].forEach(([n, type], i) => {
        drawItem({ type, x: 150 + i * 70, y: 236, w: 8, h: 6, mode: 'held' }); text(n, 154 + i * 70, 252, 7, '#fff');
      });
    },
  },
  title: {
    update() { if (pressed('Enter') || pressed('Space') || pressed('Mouse0')) { reset(); scene = 'play'; } },
    draw() {
      if (!state.p) reset();
      camX = 0; camY = LH - H; state.t = clock.now(); drawBackground(); drawRain();
      ctx.fillStyle = 'rgba(7,4,13,0.6)'; ctx.fillRect(0, 0, W, H);
      const off = Math.floor(clock.now() * 3) % 5 === 0 ? 1 : 0;
      text(TITLE, W / 2 - 2 - off, 54, 32, PAL.neonB); text(TITLE, W / 2 + 2 + off, 54, 32, PAL.neonA); text(TITLE, W / 2, 54, 32, '#fff3f8');
      shadowText('PROTÓTIPO · UMA SALA · UM GOLPE', W / 2, 80, 8, PAL.neonC);
      CONTROLS.forEach((c, i) => shadowText(c, W / 2, 110 + i * 15, 8, '#d8d0f0'));
      if (Math.floor(clock.now() * 2) % 2) shadowText('CLIQUE PARA COMEÇAR', W / 2, H - 28, 10, '#fff');
      ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,0.14)'; for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
      drawCursor();
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      if (pressed('KeyR')) { restartRoom(); return; }
      state.shake = Math.max(0, state.shake - dt * 20); state.flash = Math.max(0, state.flash - dt); state.glitch = Math.max(0, state.glitch - dt);
      if (state.hitstop > 0) { state.hitstop -= dt; return; }
      if (state.p.alive && !state.cleared) state.t += dt;
      updatePlayer(dt); updateEnemies(dt); updateItems(dt); updateBullets(dt); updateParts(dt);
      const p = state.p, tx = p.x + p.w / 2 - W / 2 + p.f * tune.camera_lookahead + (mouse.seen ? (mouse.x - W / 2) * 0.15 : 0);
      state.cam.x += (Math.max(0, Math.min(LW - W, tx)) - state.cam.x) * Math.min(1, dt * 6);
      state.cam.y = LH - H;
      if (!p.alive) { state.deadT -= dt; if (state.deadT <= 0) restartRoom(); }
      if (!state.cleared && state.kills >= state.total) {
        state.cleared = true; state.clearT = 0.8; sfx.clear(); events.push({ type: 'clear', t: state.t });
        if (best === null || state.t < best) best = state.t;
        state.gained = `SALA LIMPA EM ${state.t.toFixed(2)}s · ${state.deaths} MORTES`;
      }
      if (state.cleared) { state.clearT -= dt; if (state.clearT <= 0) scene = 'results'; }
    },
    draw() { drawWorld(); drawHUD(); drawCursor(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); shadowText('PAUSA', W / 2, H / 2, 16, '#fff'); },
  },
  results: {
    update() { if (pressed('Enter') || pressed('KeyR') || pressed('Mouse0')) { reset(); scene = 'play'; } else updateParts(STEP); },
    draw() {
      drawWorld(); ctx.fillStyle = 'rgba(7,4,13,0.65)'; ctx.fillRect(0, 0, W, H);
      text('CONTRATO CUMPRIDO', W / 2 - 1, H / 2 - 30, 16, PAL.neonA); text('CONTRATO CUMPRIDO', W / 2 + 1, H / 2 - 30, 16, PAL.neonB); text('CONTRATO CUMPRIDO', W / 2, H / 2 - 30, 16, '#fff');
      shadowText(state.gained, W / 2, H / 2, 8, '#fff');
      shadowText(`RECORDE ${best.toFixed(2)}s`, W / 2, H / 2 + 16, 8, PAL.neonC);
      shadowText('CLIQUE PARA JOGAR DE NOVO', W / 2, H / 2 + 40, 8, '#d8d0f0');
      drawCursor();
    },
  },
};

// ---- Loop -----------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  aim(x, y) { mouse.x = x; mouse.y = y; mouse.seen = true; }, // screen position, logical pixels
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
